version: '3.8'

services:
  nats:
    image: nats:latest
    command: ["-js"] 
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  api_gateway:
    build: ./api_gateway
    ports:
      - "8080:8000" 
    env_file: .env
    depends_on:
      - user_service

  user_service:
    build: ./user_service
    env_file: .env
    depends_on:
      nats:
        condition: service_healthy

  notification_service:
    build: ./notification_service
    env_file: .env
    depends_on:
      nats:
        condition: service_healthy