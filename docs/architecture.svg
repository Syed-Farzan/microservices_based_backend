<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#ffffff"/>

  <!-- Client -->
  <rect x="40" y="30" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="110" y="57" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Client</text>

  <!-- API Gateway -->
  <rect x="270" y="30" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="360" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">API Gateway</text>
  <text x="360" y="70" text-anchor="middle" font-size="12" fill="#3C3489">Auth, validation, routing</text>

  <line x1="180" y1="52" x2="266" y2="55" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="224" y="40" text-anchor="middle" font-size="12" fill="#5F5E5A">POST /api/users</text>

  <!-- User Service -->
  <rect x="270" y="140" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="360" y="162" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">User Service</text>
  <text x="360" y="180" text-anchor="middle" font-size="12" fill="#3C3489">Validates, publishes event</text>

  <line x1="360" y1="86" x2="360" y2="138" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="440" y="115" text-anchor="middle" font-size="12" fill="#5F5E5A">REST</text>

  <!-- NATS JetStream -->
  <rect x="250" y="250" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="360" y="272" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">NATS JetStream</text>
  <text x="360" y="290" text-anchor="middle" font-size="12" fill="#085041">Stream USER_EVENTS</text>

  <line x1="360" y1="196" x2="360" y2="248" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="460" y="225" text-anchor="middle" font-size="12" fill="#5F5E5A">publish user.created</text>

  <!-- Notification Service -->
  <rect x="270" y="360" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="360" y="382" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Notification Service</text>
  <text x="360" y="400" text-anchor="middle" font-size="12" fill="#3C3489">Durable subscriber</text>

  <line x1="360" y1="306" x2="360" y2="358" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="465" y="335" text-anchor="middle" font-size="12" fill="#5F5E5A">durable subscribe</text>
</svg>
